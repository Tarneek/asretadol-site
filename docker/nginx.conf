worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 110m;

  # Docker embedded DNS — re-resolve service names after container recreate
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name niranews.com www.niranews.com;

    # Canonical host: redirect www → apex (adjust if you prefer www as primary)
    if ($host = www.niranews.com) {
      return 301 https://niranews.com$request_uri;
    }

    # Uploaded media from the host bind mount (UPLOAD_HOST_DIR → /var/www/uploads).
    # Layout: blog/{thumbnails,main,content}/, news/, videos/
    # Do not use try_files with alias — nginx resolves try_files against root, not alias.
    location /uploads/ {
      alias /var/www/uploads/;
      expires 7d;
      add_header Cache-Control "public";
      add_header Cross-Origin-Resource-Policy "cross-origin";
      access_log off;
    }

    # Next.js BFF (session cookies + multipart uploads) — must NOT go to Nest.
    # Browser posts to /api/admin/articles/media/upload; Nest's route is
    # POST /api/articles/media/upload (called server-side by the BFF).
    location /api/auth/ {
      set $web_upstream http://web:3010;
      proxy_http_version 1.1;
      client_max_body_size 110m;
      proxy_request_buffering off;
      proxy_connect_timeout 60s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass $web_upstream;
    }

    location /api/admin/ {
      set $web_upstream http://web:3010;
      proxy_http_version 1.1;
      client_max_body_size 110m;
      proxy_request_buffering off;
      proxy_connect_timeout 60s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass $web_upstream;
    }

    # NestJS API (global prefix is already /api)
    location /api/ {
      set $api_upstream http://api:3020;
      proxy_http_version 1.1;
      client_max_body_size 110m;
      proxy_request_buffering off;
      proxy_connect_timeout 60s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass $api_upstream;
    }

    # Next.js site
    location / {
      set $web_upstream http://web:3010;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass $web_upstream;
    }
  }
}
