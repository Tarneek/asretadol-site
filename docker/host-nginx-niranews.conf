# Optional fallback if systemd Nginx ever owns :80 on this host.
# On srv1549023911, Docker's shared proxy (network `net`) already binds :80.
# Do NOT enable this vhost while docker-proxy is listening on :80 — it will
# fail with "address already in use" and take down other host-Nginx sites.
#
#   sudo cp docker/host-nginx-niranews.conf /etc/nginx/sites-available/niranews.com
#   sudo ln -sf /etc/nginx/sites-available/niranews.com /etc/nginx/sites-enabled/niranews.com
#   sudo nginx -t && sudo nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name www.niranews.com;
    return 301 https://niranews.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name niranews.com;

    client_max_body_size 110m;

    location /uploads/ {
        alias /srv/niranews/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        access_log off;
    }

    location /api/auth/ {
        proxy_http_version 1.1;
        client_max_body_size 110m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3010;
    }

    location /api/admin/ {
        proxy_http_version 1.1;
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3010;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3020;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3010;
    }
}
