version: '3.8'

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: news-platform-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5432}}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_secret}
      POSTGRES_DB: ${POSTGRES_DB:-news_platform}
    volumes:
       - ${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news_platform}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: news-platform-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-${POSTGRES_USER:-news}}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-news_secret}}
      DATABASE_NAME: ${DATABASE_NAME:-${POSTGRES_DB:-news_platform}}
      API_PORT: 3020
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/srv/uploads}
      UPLOAD_DIR: ${UPLOAD_DIR:-/srv/uploads/blog}
      ARTICLE_UPLOAD_DIR: ${ARTICLE_UPLOAD_DIR:-/srv/uploads/news}
      ARTICLE_VIDEO_UPLOAD_DIR: ${ARTICLE_VIDEO_UPLOAD_DIR:-/srv/uploads/videos}
      UPLOAD_UID: ${UPLOAD_UID:-1000}
      UPLOAD_GID: ${UPLOAD_GID:-1000}
      TRUST_PROXY: 'true'
      SEED_ADMIN_ENABLED: 'false'
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-${JWT_SECRET}}"
      JWT_ACCESS_EXPIRES_IN: "${JWT_ACCESS_EXPIRES_IN:-15m}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-${JWT_SECRET}}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-7d}"
    volumes:
      - ${UPLOADS_HOST_PATH:-/srv/niranews/uploads}:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: news-platform-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3010
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3020/api}
    depends_on:
      - api
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: news-platform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${UPLOADS_HOST_PATH:-/srv/niranews/uploads}:/srv/uploads:ro
      - ./docker/nginx-client-max-body-size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
    depends_on:
      - web
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
