services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: news-platform-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5432}}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_secret}
      POSTGRES_DB: ${POSTGRES_DB:-news_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news_platform}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: news-platform-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # env_file still has localhost/3001 for `pnpm dev`. Override for Docker.
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-${POSTGRES_USER:-news}}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-news_secret}}
      DATABASE_NAME: ${DATABASE_NAME:-${POSTGRES_DB:-news_platform}}
      API_PORT: 3020
      UPLOAD_ROOT: /srv/uploads
      UPLOAD_DIR: /srv/uploads/blog
      ARTICLE_UPLOAD_DIR: /srv/uploads/news
      ARTICLE_VIDEO_UPLOAD_DIR: /srv/uploads/videos
      UPLOAD_UID: ${UPLOAD_UID:-1000}
      UPLOAD_GID: ${UPLOAD_GID:-1000}
      TRUST_PROXY: 'true'
      SEED_ADMIN_ENABLED: 'false'
      # Nest requires these names. Fall back to older JWT_SECRET / JWT_EXPIRES_IN.
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-${JWT_SECRET:?Set JWT_ACCESS_SECRET or JWT_SECRET in .env (32+ chars)}}"
      JWT_ACCESS_EXPIRES_IN: "${JWT_ACCESS_EXPIRES_IN:-${JWT_EXPIRES_IN:-15m}}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-${JWT_SECRET:?Set JWT_REFRESH_SECRET or JWT_SECRET in .env (32+ chars)}}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-7d}"
    ports:
      - '127.0.0.1:3020:3020'
    volumes:
      - ${UPLOADS_HOST_PATH}:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3020/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://niranews.com/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://niranews.com}
    container_name: news-platform-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3020/api}
    ports:
      - '127.0.0.1:3010:3010'
    volumes:
      - ${UPLOADS_HOST_PATH}:/app/apps/web/public/uploads:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: news-platform-nginx
    restart: unless-stopped
    expose:
      - '80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${UPLOADS_HOST_PATH}:/var/www/uploads:ro
    environment:
      VIRTUAL_HOST: niranews.com,www.niranews.com
      VIRTUAL_PORT: '80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - internal
      - proxy

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: net
