services:
  postgres:
    # Must match the major version that created the postgres_data volume.
    # Server (existing data): 15 | Fresh local after PG16 init: 16
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    container_name: news-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_secret}
      POSTGRES_DB: ${POSTGRES_DB:-news_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news_platform}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Local: POSTGRES_PORT=5433 in .env. Deploy: POSTGRES_HOST_PORT=127.0.0.1:5432
      - '${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5432}}:5432'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: news-platform-api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-news}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-news_platform}
      API_PORT: 3020
      # Container paths must match the bind mount below. Host path is UPLOAD_HOST_DIR.
      UPLOAD_ROOT: /srv/uploads
      UPLOAD_DIR: /srv/uploads/blog
      ARTICLE_UPLOAD_DIR: /srv/uploads/news
      ARTICLE_VIDEO_UPLOAD_DIR: /srv/uploads/videos
      UPLOAD_UID: ${UPLOAD_UID:-1000}
      UPLOAD_GID: ${UPLOAD_GID:-1000}
      TRUST_PROXY: 'true'
      SEED_ADMIN_ENABLED: 'false'
    ports:
      # Host Nginx reverse-proxies here. Bound to loopback only — not public :80.
      - '127.0.0.1:3020:3020'
    volumes:
      # Host /srv/... → container /srv/uploads (do not use a named volume in production).
      - ${UPLOAD_HOST_DIR:-/srv/niranews/uploads}:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3020/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://niranews.com/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://niranews.com}
    container_name: news-platform-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      # Server-side Nest reachability (avoids looping public /api/auth/* through nginx)
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3020/api}
    ports:
      - '127.0.0.1:3010:3010'
    volumes:
      - ${UPLOAD_HOST_DIR:-/srv/niranews/uploads}:/app/apps/web/public/uploads:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  # Path routing for niranews.com. Does NOT bind host :80 — the shared Docker
  # proxy on network `net` already owns port 80 (VIRTUAL_HOST registration).
  nginx:
    image: nginx:1.27-alpine
    container_name: news-platform-nginx
    restart: unless-stopped
    expose:
      - '80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${UPLOAD_HOST_DIR:-/srv/niranews/uploads}:/var/www/uploads:ro
    environment:
      VIRTUAL_HOST: niranews.com,www.niranews.com
      VIRTUAL_PORT: '80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - internal
      - proxy

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: net
