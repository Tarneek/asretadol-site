services:
  postgres:
    # Must match the major version that created the postgres_data volume.
    # Server (existing data): 15 | Fresh local after PG16 init: 16
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    container_name: news-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_secret}
      POSTGRES_DB: ${POSTGRES_DB:-news_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news_platform}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Local: POSTGRES_PORT=5433 in .env. Deploy: POSTGRES_HOST_PORT=127.0.0.1:5432
      - '${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5432}}:5432'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: news-platform-api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-news}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-news_platform}
      API_PORT: 3020
      ARTICLE_UPLOAD_DIR: /app/uploads/news
      ARTICLE_VIDEO_UPLOAD_DIR: /app/uploads/videos
      TRUST_PROXY: 'true'
      SEED_ADMIN_ENABLED: 'false'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3020/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://asretaadol.ir/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://asretaadol.ir}
    container_name: news-platform-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      # Server-side Nest reachability (avoids looping public /api/auth/* through nginx)
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3020/api}
    volumes:
      - uploads_data:/app/apps/web/public/uploads
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  # Path-based gateway for nginx-proxy (jwilder): / → web, /api → api, /uploads → volume
  nginx:
    image: nginx:1.27-alpine
    container_name: news-platform-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro
    environment:
      VIRTUAL_HOST: asretaadol.ir,www.asretaadol.ir
      VIRTUAL_PORT: '80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - internal
      - proxy

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: net
